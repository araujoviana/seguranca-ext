<body class="checklist">
<a class="skip" href="#conteudo">Ir para o conteúdo</a>
<header id="topo"></header>
<main id="conteudo">
<h1>Checklist: antes de aproximar o cartão</h1>
<h2 id="antes-de-sair-de-casa">Antes de sair de casa</h2>
<ul class="task-list">
<li><label><input type="checkbox" />As notificações de compra do app do banco estão ativadas.</label></li>
<li><label><input type="checkbox" />Vou a um lugar cheio (bloco, show, transporte lotado)? Desativei a aproximação no app ou deixei o cartão só na carteira digital.</label></li>
<li><label><input type="checkbox" />O celular tem bloqueio de tela (biometria ou senha).</label></li>
<li><label><input type="checkbox" />Sei onde fica o botão de bloquear o cartão no app e qual é o telefone do banco.</label></li>
</ul>
<h2 id="na-hora-de-pagar">Na hora de pagar</h2>
<ul class="task-list">
<li><label><input type="checkbox" />Conferi o valor no visor antes de aproximar.</label></li>
<li><label><input type="checkbox" />O visor da maquininha está inteiro e legível.</label></li>
<li><label><input type="checkbox" />Eu mesmo passei o cartão, e ele não saiu da minha vista.</label></li>
<li><label><input type="checkbox" />A maquininha “não aceita aproximação” e pediram a senha? Desconfiei e, se possível, paguei de outra forma.</label></li>
<li><label><input type="checkbox" />Se digitei a senha, cobri o teclado e o visor mostrou só asteriscos.</label></li>
</ul>
<h2 id="depois-de-pagar">Depois de pagar</h2>
<ul class="task-list">
<li><label><input type="checkbox" />Conferi se o cartão devolvido é o meu antes de guardar.</label></li>
<li><label><input type="checkbox" />A notificação da compra chegou e o valor está certo.</label></li>
</ul>
<h2 id="se-algo-der-errado">Se algo der errado</h2>
<ul class="task-list">
<li><label><input type="checkbox" />Bloqueei o cartão no app e liguei para o banco.</label></li>
<li><label><input type="checkbox" />Contestei as compras que não reconheço logo: quanto mais cedo o banco for avisado, menor tende a ser o prejuízo.</label></li>
<li><label><input type="checkbox" />Guardei prints e comprovantes e registrei boletim de ocorrência, se houve furto ou golpe.</label></li>
</ul>
</main>
